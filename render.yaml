databases:
  - name: microservice-db
    databaseName: microservice
    user: microservice
    plan: free
    region: oregon

services:
  - type: web
    name: microservice-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: microservice-db
          property: connectionString